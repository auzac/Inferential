[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inferential-model-studio"
dynamic = ["version"]
description = "Offline Windows desktop workbench for building industrial inferential (soft-sensor) models."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Inferential Model Studio team" }]
dependencies = [
    "PySide6>=6.7,<6.10",
    "pyqtgraph>=0.13.7,<0.15",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scipy>=1.12,<2",
    "scikit-learn>=1.4,<2",
    "openpyxl>=3.1,<4",
    "tzdata>=2024.1",          # IANA timezone database; required on Windows for zoneinfo
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.5",
]
build = [
    "pyinstaller>=6.6",
]

[project.scripts]
inferential-studio-synth = "inferential_studio.core.synthetic:main"

[project.gui-scripts]
inferential-studio = "inferential_studio.app:main"

[tool.setuptools.dynamic]
version = { attr = "inferential_studio.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra"
# A test stuck for 5 minutes dumps every thread's stack (diagnoses hangs instead of silence).
faulthandler_timeout = 300
markers = [
    "gui: tests that create Qt widgets (run offscreen in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
